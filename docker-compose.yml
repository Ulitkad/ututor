services:
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/ututor.db
      ADMIN_CREDENTIALS_PATH: /app/.admin_credentials
      TRUST_NGINX: "true"
    volumes:
      - ./data:/app/data
      - ./.admin_credentials:/app/.admin_credentials
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
